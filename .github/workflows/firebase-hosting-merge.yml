name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - stage
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build Atlas for staging
        run: npm ci && npm run build -w @atlas/contracts && npm run build -w atlas
        env:
          VITE_PUBLIC_MAP_MANIFEST_URL: https://pub-ba3ece4cf7ad4e828c1b86747124f613.r2.dev/phase-0/eldoria/v1/eldoria-manifest.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ATLAS_PROJECT_509605 }}
          channelId: live
          projectId: atlas-project-509605
